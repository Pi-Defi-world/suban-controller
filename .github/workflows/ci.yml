name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production, blocking)
        run: pnpm audit --prod --audit-level=high
      - name: Dependency audit (all, report only)
        continue-on-error: true
        run: pnpm audit --audit-level=moderate
      - run: pnpm build
      - run: pnpm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan working tree
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect --no-git \
            --source=/repo --config=/repo/.gitleaks.toml --redact --verbose
      - name: Scan git history (report only)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/repo --config=/repo/.gitleaks.toml --redact --verbose
